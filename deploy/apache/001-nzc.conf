# NZC（竺可桢-南森国际研究中心）站点 - HTTP
# 放到 /etc/apache2/sites-available/001-nzc.conf，用 a2ensite 启用

<VirtualHost *:80>
    ServerName nzc.iap.ac.cn
    # 部署时替换成实际管理员邮箱
    ServerAdmin admin@example.com
    DocumentRoot /var/www/nzc/public

    <Directory /var/www/nzc/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 全站跳 HTTPS，保留路径
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  ${APACHE_LOG_DIR}/nzc-error.log
    CustomLog ${APACHE_LOG_DIR}/nzc-access.log combined
</VirtualHost>
