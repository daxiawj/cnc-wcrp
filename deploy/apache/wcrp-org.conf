# www.cnc-wcrp.org -> https://www.cnc-wcrp.cn 永久跳转
# 放到 /etc/apache2/sites-available/wcrp-org.conf，用 a2ensite 启用
#
# 背景：CNC-WCRP 官网已于 2026-10 迁至 Hugo + Netlify，主域名 www.cnc-wcrp.cn。
# 本机只负责把老域名的流量 301 过去，不再提供页面。
#
# 两个必须遵守的点：
#   1. VirtualHost 一律写 *:80 / *:443。写成 <VirtualHost www.cnc-wcrp.org:80>
#      会被 Apache 解析成 IP 单独成组，和 nzc 的组冲突，导致 80 端口不生效。
#   2. 必须放行 /.well-known/acme-challenge/，否则 certbot 续期被 301 走。

<VirtualHost *:80>
    ServerName www.cnc-wcrp.org
    # 部署时替换成实际管理员邮箱
    ServerAdmin admin@example.com

    # certbot（apache 插件）把验证文件写在这里
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://www.cnc-wcrp.cn$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/wcrp-org-error.log
    CustomLog ${APACHE_LOG_DIR}/wcrp-org-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.cnc-wcrp.org
    # 部署时替换成实际管理员邮箱
    ServerAdmin admin@example.com

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/www.cnc-wcrp.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.cnc-wcrp.org/privkey.pem

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://www.cnc-wcrp.cn$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/wcrp-org-error.log
    CustomLog ${APACHE_LOG_DIR}/wcrp-org-access.log combined
</VirtualHost>
</IfModule>
