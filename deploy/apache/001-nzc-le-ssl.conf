# NZC（竺可桢-南森国际研究中心）站点 - HTTPS
# 放到 /etc/apache2/sites-available/001-nzc-le-ssl.conf，用 a2ensite 启用
#
# 证书覆盖 nzc.iap.ac.cn 和 www.cnc-wcrp.org 两个域名。
# 注意：www.cnc-wcrp.org 现在由 wcrp-org.conf 接管做 301，
# 但证书里仍需保留它，否则续期时只剩 nzc 一个域名，.org 的 HTTPS 会失效。
# 如果将来要把 .org 从这张证书里去掉，必须先确认 wcrp-org.conf 用的是独立证书。

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName nzc.iap.ac.cn
    # 部署时替换成实际管理员邮箱
    ServerAdmin admin@example.com
    DocumentRoot /var/www/nzc/public

    <Directory /var/www/nzc/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/nzc.iap.ac.cn/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/nzc.iap.ac.cn/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/nzc-error.log
    CustomLog ${APACHE_LOG_DIR}/nzc-access.log combined
</VirtualHost>
</IfModule>
